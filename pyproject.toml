[tool.poetry]
name = "audit-inquiry-automation"
version = "0.1.0"
description = "금융거래조회서 표 인식 및 데이터 추출 자동화"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# 여기에 파이썬 버전이 있어야 모든 그룹이 이 기준을 따릅니다.
python = ">=3.10,<3.13" 
numpy = "<2.0.0"

[tool.poetry.group.tesseract.dependencies]
img2table = "^1.2.5"
pytesseract = "^0.3.10"
opencv-python = "^4.8.0"
Pillow = "^10.0.0"
pandas = "^2.0.0"
openpyxl = "^3.1.0"

[tool.poetry.group.easyocr.dependencies]
easyocr = "^1.7.2"

# [Torch 설정] OS별 자동 분기 (Linux는 GPU/일반, 그 외는 CPU 강제)
torch = [
    {version = "^2.2.2", source = "pytorch_cpu", markers = "sys_platform != 'linux'"},
    {version = "^2.2.2", markers = "sys_platform == 'linux'"}
]
torchvision = [
    {version = "^0.17.2", source = "pytorch_cpu", markers = "sys_platform != 'linux'"},
    {version = "^0.17.2", markers = "sys_platform == 'linux'"}
]

[tool.poetry.group.paddleocr.dependencies]


[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
